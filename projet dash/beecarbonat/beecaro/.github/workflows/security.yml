name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1'
  push:
    paths:
      - '**/package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
